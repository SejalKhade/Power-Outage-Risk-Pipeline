name: CI — Power Outage Risk Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all pipeline files exist
        run: |
          python -c "
          import os
          files = [
              'src/preprocess.py',
              'src/medallion.py',
              'src/flows.py',
              'src/s3_publish.py',
              'src/features.py',
              'src/train.py',
              'src/utils.py',
              'api/main.py',
              'Dockerfile',
              'requirements.txt',
          ]
          for f in files:
              assert os.path.exists(f), f'MISSING: {f}'
              print(f'OK: {f}')
          print('All pipeline files verified.')
          "

      - name: Test API imports
        run: |
          python -c "
          from fastapi import FastAPI
          from pydantic import BaseModel
          import joblib, pandas, numpy, sklearn
          print('All dependencies import successfully')
          "

      - name: Test src imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.utils import safe_num, ensure_dir, log_step
          print('src.utils imports OK')
          "

      - name: Run unit tests
        run: pytest tests/ -v